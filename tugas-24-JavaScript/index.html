<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: rgb(0, 0, 0);
            color: white;
        }
    </style>
</head>
<body>
    <p id="isi" style="font-size: x-large;"></p>
    <button onclick="ganTi()" style="width: 90px;height: 50px;">KLIK</button>

    <p id="ibam">p</p>
    <button onclick="ibam()">click</button>
    <script>
        function ibam (){
            document.getElementById("ibam").innerHTML = "Ibam"
        }
    </script>

    <script>
        function ganTi(){
            document.getElementById("isi").innerHTML = "Teks ini ditambahkan dengan JavaScript. by Ibrahim Omar" 
        }
    </script>
    
    <script>
        console.warn ('ini adalah peringatan');
        console.error ('ini adalah kesalahan');
    </script>
    
</body>
</html>
