<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/output.css" />
    <title>Testing</title>
  </head>
  <body>
    <header class="flex p-4 justify-between">
      <div class="flex gap-1">
        <img
          src="img/laliga-removebg-preview.png"
          alt="logo"
          class="w-7 h-auto"
        />
        <h1 class="text-[14px] font-barlow font-bold italic text-[#FF4B44] pt-0.5">LaLiga</h1>
      </div>
      <button id="menu-button">
        <svg
          id="menu-icon"
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            id="menu-path"
            stroke-linecap="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
    </header>
    <nav>
      <ul id="mobile-menu" class="hidden flex flex-col gap-2 bg-gray-800 text-white ">
        <li class="font-space font-bold p-3 hover:bg-gray-900 hover:cursor-pointer"><a href="#">Home</a></li>
        <li class="font-space font-bold p-3 hover:bg-gray-900 hover:cursor-pointer"><a href="#">Teams</a></li>
        <li class="font-space font-bold p-3 hover:bg-gray-900 hover:cursor-pointer"><a href="#">News</a></li>
        <li class="font-space font-bold p-3 hover:bg-gray-900 hover:cursor-pointer"><a href="#">Injury</a></li>
        <li class="font-space font-bold p-3 hover:bg-gray-900 hover:cursor-pointer"><a href="#">Standings</a></li>
        <li class="font-space font-bold p-3 hover:bg-gray-900 hover:cursor-pointer"><a href="#">Statistics</a></li>
      </ul>
    </nav>
    <section class="bg-[url('/img/heroimg.png')] bg-cover bg-no-repeat bg-center">
      <h1 class="">DevGoal</h1>
    </section>
    <script>
      const menuButton = document.getElementById("menu-button");

      const mobileMenu = document.getElementById("mobile-menu");

      const menuPath = document.getElementById("menu-path");

      // deteksi click pada tombol menu
      menuButton.addEventListener("click", () => {
        // kondisi aksinya
        mobileMenu.classList.toggle("hidden");
        // cek apakah menu sedang terbuka?
        const isOpen = mobileMenu.classList.contains("hidden");
        // ubah icon menu
        //       if (isOpen) {
        //     menuPath.setAttribute("d", "M6 6l12 12M6 18L18 6");
        // } else {
        //     menuPath.setAttribute("d", "M4 6h16M4 12h16M4 18h16");
        // }
        menuPath.setAttribute(
          "d",
          isOpen ? "M4 6h16M4 12h16M4 18h16" : "M6 18L18 6M6 6l12 12",
        );
      });
    </script>
  </body>
</html>
