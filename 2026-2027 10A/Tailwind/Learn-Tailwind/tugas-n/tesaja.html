<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Mode Toggle</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class'
  }
</script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 transition-colors duration-300">

  <div class="flex flex-col items-center gap-6 p-10 rounded-2xl bg-white dark:bg-gray-800 shadow-lg">
    
    <h1 class="text-xl font-semibold text-gray-800 dark:text-gray-100">
      Toggle Dark Mode
    </h1>

    <!-- Tombol Toggle -->
    <button
      id="themeToggle"
      class="flex items-center justify-center w-14 h-14 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-300"
    >
      <!-- Ikon Bulan (muncul saat tema terang, klik untuk ke gelap) -->
      <svg id="iconMoon" class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
      </svg>

      <!-- Ikon Matahari (muncul saat tema gelap, klik untuk ke terang) -->
      <svg id="iconSun" class="hidden w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"/>
        <path stroke-linecap="round" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>

    <p class="text-sm text-gray-500 dark:text-gray-400">
      Klik tombol untuk mengganti tema
    </p>
  </div>

<script>
  const html = document.documentElement;
  const toggleBtn = document.getElementById('themeToggle');
  const iconMoon = document.getElementById('iconMoon');
  const iconSun = document.getElementById('iconSun');

  function updateIcon() {
    if (html.classList.contains('dark')) {
      // Tema gelap aktif -> tampilkan ikon matahari
      iconMoon.classList.add('hidden');
      iconSun.classList.remove('hidden');
    } else {
      // Tema terang aktif -> tampilkan ikon bulan
      iconSun.classList.add('hidden');
      iconMoon.classList.remove('hidden');
    }
  }

  toggleBtn.addEventListener('click', function () {
    html.classList.toggle('dark');
    updateIcon();
  });

  // Set ikon awal saat halaman dimuat
  updateIcon();
</script>

</body>
</html>
