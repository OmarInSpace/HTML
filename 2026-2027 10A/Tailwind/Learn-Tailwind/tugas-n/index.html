<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resto</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="input.css">
  </head>
  <body class="font-sans" >
    <header
      class="flex justify-between items-center px-7 py-2 shadow-lg sticky top-0 right-0 bg-white"
    >
      <nav class="flex justify-between">
        <h1 class="font-bold">Food<span class="text-amber-600">.</span></h1>
        <ul class="gap-8 hidden md:flex md:font-medium md:text-xl left justify-between">
          <li class="md:hover:cursor-pointer md:hover:text-[#CD8113]">
            <a href="#">Home</a>
          </li>
          <li class="md:hover:cursor-pointer md:hover:text-[#CD8113]">
            <a href="#">Tentang Kami</a>
          </li>
          <li class="md:hover:cursor-pointer md:hover:text-[#CD8113]">
            <a href="#">Menu</a>
          </li>
          <li class="md:hover:cursor-pointer md:hover:text-[#CD8113]">
            <a href="#">Layanan</a>
          </li>
        </ul>
        <img src="" alt="" />
         <button id="theme-toogle" class="rounded-lg bg-slate-200 px-4 py-2 font-medium text-slate-800 hover:bg-slate-300 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
        🌙
    </button>
      </nav>
    </header>

    <script>
      // On page load, set the theme from localStorage or system settings
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
      const toogleButton = document.getElementById('theme-toogle');
      toogleButton.addEventListener('click', () => {
          if (document.documentElement.classList.contains('dark')) {
              document.documentElement.classList.remove('dark');
              localStorage.theme = 'light';
          } else {
              document.documentElement.classList.add('dark');
              localStorage.theme = 'dark';
          }
      })
    </script>
  </body>
</html>
